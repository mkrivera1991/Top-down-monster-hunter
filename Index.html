<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Phaser 3 Top-Down Player & Giant Enemies</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
        }
        #game-container {
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    preload() {
        let g = this.make.graphics({ x: 0, y: 0, add: false });
        
        // 1. Player Body
        g.fillStyle(0x3498db, 1);
        g.fillCircle(16, 16, 16);
        g.generateTexture('player', 32, 32);
        g.clear();

        // 2. Flintlock Gun
        g.fillStyle(0x8b4513, 1);
        g.fillRect(0, 5, 14, 6);
        g.fillStyle(0x7f8c8d, 1);
        g.fillRect(10, 4, 14, 4);
        g.fillStyle(0xd4af37, 1);
        g.fillRect(6, 3, 4, 3);
        g.generateTexture('gun', 24, 16);
        g.clear();

        // 3. Lead Musket Ball
        g.fillStyle(0xbdc3c7, 1);
        g.fillCircle(4, 4, 4);
        g.generateTexture('bullet', 8, 8);
        g.clear();

        // 4. Giant Enemy Body
        g.fillStyle(0xc0392b, 1);
        g.fillCircle(48, 48, 48);
        g.generateTexture('giant', 96, 96);
        g.clear();

        // 5. Virtual Controls Graphics
        g.fillStyle(0xffffff, 0.2);
        g.fillCircle(40, 40, 40);
        g.generateTexture('joy-base', 80, 80);
        g.clear();

        g.fillStyle(0xffffff, 0.5);
        g.fillCircle(20, 20, 20);
        g.generateTexture('joy-thumb', 40, 40);
        g.clear();

        g.fillStyle(0xe74c3c, 0.6);
        g.fillCircle(30, 30, 30);
        g.generateTexture('dodge-btn', 60, 60);
        g.destroy();
    }

    create() {
        this.input.addPointer(2);

        // Player Parameters
        this.speed = 125;
        this.dodgeSpeed = 350;
        this.dodgeDuration = 400;
        this.dodgeCooldown = 600;
        this.bulletSpeed = 500;
        this.fireCooldown = 1500;
        
        // --- Health & Invincibility (i-Frames) ---
        this.playerMaxHealth = 3;
        this.playerHealth = 3;
        this.isInvulnerable = false; // Triggered by dodge roll or hit recovery
        this.postHitIFrameDuration = 1000; // 1s grace period after getting hit

        // Flags
        this.canFire = true;
        this.isDodging = false;
        this.canDodge = true;
        this.currentWeapon = "GUN";
        this.lastDirection = new Phaser.Math.Vector2(0, 1);
        this.dodgeVector = new Phaser.Math.Vector2(0, 0);
        this.touchMoveVector = new Phaser.Math.Vector2(0, 0);

        // Scene Groups
        this.bullets = this.physics.add.group({ defaultKey: 'bullet', maxSize: 30 });
        this.enemies = this.physics.add.group();
        this.shockwaves = this.physics.add.group();

        // Spawn Player
        this.player = this.physics.add.sprite(400, 450, 'player');
        this.player.setCollideWorldBounds(true);

        this.gun = this.add.sprite(this.player.x, this.player.y, 'gun');
        this.gun.setOrigin(0, 0.5);

        // Graphics Layer
        this.reloadGraphics = this.add.graphics().setDepth(10);
        this.uiGraphics = this.add.graphics().setDepth(100);

        // Input
        this.keys = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D,
            dodge: Phaser.Input.Keyboard.KeyCodes.SPACE
        });

        this.setupVirtualControls();

        this.input.on('pointerdown', (pointer) => {
            if (this.isPointerOverUI(pointer)) return;
            if (!this.isDodging && this.canFire && this.currentWeapon === "GUN") {
                this.aimGunAt(pointer.x, pointer.y);
                this.fireBullet();
            }
        });

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.isDodging && this.canDodge) this.startDodge();
        });

        // Collisions
        this.physics.add.overlap(this.bullets, this.enemies, this.handleBulletEnemyCollision, null, this);
        this.physics.add.overlap(this.player, this.shockwaves, this.handlePlayerShockwaveCollision, null, this);

        // Spawn Initial Giant Enemy
        this.spawnGiantEnemy(400, 150);
    }

    setupVirtualControls() {
        this.joyBase = this.add.image(100, 500, 'joy-base').setScrollFactor(0).setDepth(100).setInteractive();
        this.joyThumb = this.add.image(100, 500, 'joy-thumb').setScrollFactor(0).setDepth(101);

        this.joyBase.on('pointerdown', (p) => this.handleJoystick(p));
        this.joyBase.on('pointermove', (p) => { if (p.isDown) this.handleJoystick(p); });
        this.joyBase.on('pointerup', () => this.resetJoystick());

        this.dodgeBtn = this.add.image(700, 500, 'dodge-btn').setScrollFactor(0).setDepth(100).setInteractive();
        this.dodgeBtn.on('pointerdown', () => {
            if (!this.isDodging && this.canDodge) this.startDodge();
        });
    }

    handleJoystick(pointer) {
        let angle = Phaser.Math.Angle.Between(this.joyBase.x, this.joyBase.y, pointer.x, pointer.y);
        let dist = Phaser.Math.Distance.Between(this.joyBase.x, this.joyBase.y, pointer.x, pointer.y);
        let clampDist = Math.min(dist, 40);

        this.joyThumb.x = this.joyBase.x + Math.cos(angle) * clampDist;
        this.joyThumb.y = this.joyBase.y + Math.sin(angle) * clampDist;

        this.touchMoveVector.set(Math.cos(angle), Math.sin(angle));
    }

    resetJoystick() {
        this.joyThumb.x = this.joyBase.x;
        this.joyThumb.y = this.joyBase.y;
        this.touchMoveVector.set(0, 0);
    }

    isPointerOverUI(pointer) {
        let distJoy = Phaser.Math.Distance.Between(pointer.x, pointer.y, this.joyBase.x, this.joyBase.y);
        let distBtn = Phaser.Math.Distance.Between(pointer.x, pointer.y, this.dodgeBtn.x, this.dodgeBtn.y);
        return (distJoy <= 50 || distBtn <= 40);
    }

    // --- Giant Enemy Logic ---
    spawnGiantEnemy(x, y) {
        let enemy = this.enemies.create(x, y, 'giant');
        enemy.setCollideWorldBounds(true);
        enemy.health = 40;
        enemy.maxHealth = 40;
        enemy.nextAttackTime = 0;
        enemy.isAttacking = false;

        // Health Bar UI Container attached to enemy
        enemy.hpBar = this.add.graphics();
    }

    update(time, delta) {
        if (this.playerHealth <= 0) return;

        const pointer = this.input.activePointer;

        // 1. Dodging Movement
        if (this.isDodging) {
            this.player.setVelocity(this.dodgeVector.x * this.dodgeSpeed, this.dodgeVector.y * this.dodgeSpeed);
            this.gun.setVisible(false);
            this.reloadGraphics.clear();
        } else {
            // 2. Normal WASD + Touch Movement
            let moveX = 0, moveY = 0;
            if (this.keys.left.isDown) moveX -= 1;
            if (this.keys.right.isDown) moveX += 1;
            if (this.keys.up.isDown) moveY -= 1;
            if (this.keys.down.isDown) moveY += 1;

            let moveVector = new Phaser.Math.Vector2(moveX, moveY);
            if (this.touchMoveVector.length() > 0) {
                moveVector.copy(this.touchMoveVector);
            } else if (moveVector.length() > 0) {
                moveVector.normalize();
            }

            if (moveVector.length() > 0) {
                this.lastDirection.copy(moveVector);
                this.player.setVelocity(moveVector.x * this.speed, moveVector.y * this.speed);
            } else {
                this.player.setVelocity(0, 0);
            }

            // 3. Aiming
            if (this.currentWeapon === "GUN") {
                this.gun.setVisible(true);
                this.gun.setPosition(this.player.x, this.player.y);
                if (!this.sys.game.device.os.iOS && pointer.isDown) {
                    this.aimGunAt(pointer.x, pointer.y);
                }
            }
        }

        // 4. Update Enemies & AI Attacks
        this.enemies.getChildren().forEach((enemy) => {
            if (!enemy.active) return;

            // Simple Chase Behavior
            if (!enemy.isAttacking) {
                this.physics.moveToObject(enemy, this.player, 40);
            } else {
                enemy.setVelocity(0, 0);
            }

            // Trigger Shockwave Attack every 3.5 Seconds
            if (time > enemy.nextAttackTime) {
                this.performShockwaveAttack(enemy, time);
            }

            // Update Enemy HP Bar Position
            enemy.hpBar.clear();
            enemy.hpBar.fillStyle(0x000000, 0.5);
            enemy.hpBar.fillRect(enemy.x - 30, enemy.y - 65, 60, 8);
            enemy.hpBar.fillStyle(0x2ecc71, 1);
            enemy.hpBar.fillRect(enemy.x - 30, enemy.y - 65, (enemy.health / enemy.maxHealth) * 60, 8);
        });

        // 5. Render UI Bars
        this.updateReloadBar();
        this.renderPlayerHealthUI();
    }

    performShockwaveAttack(enemy, time) {
        enemy.isAttacking = true;
        enemy.nextAttackTime = time + 3500; // Cooldown between ground slams

        // Telegraphed wind-up animation (Enemy flashes yellow before slamming)
        this.tweens.add({
            targets: enemy,
            tint: 0xf1c40f,
            duration: 500,
            yoyo: true,
            onComplete: () => {
                if (!enemy.active) return;
                enemy.clearTint();
                enemy.isAttacking = false;

                // Create Expanding Shockwave Circle
                let shockwave = this.add.circle(enemy.x, enemy.y, 10);
                this.physics.add.existing(shockwave);
                shockwave.body.setCircle(10);
                this.shockwaves.add(shockwave);

                // Expand shockwave physically and visually
                this.tweens.add({
                    targets: shockwave,
                    radius: 120,
                    alpha: 0,
                    duration: 800,
                    onUpdate: () => {
                        if (shockwave.body) {
                            shockwave.body.setCircle(shockwave.radius);
                            shockwave.body.offset.set(10 - shockwave.radius, 10 - shockwave.radius);
                        }
                    },
                    onComplete: () => {
                        shockwave.destroy();
                    }
                });
            }
        });
    }

    // --- Dodge Roll with i-Frames ---
    startDodge() {
        this.isDodging = true;
        this.canDodge = false;
        this.isInvulnerable = true; // --- i-Frames ENABLED ---
        this.player.setAlpha(0.5);   // Visual feedback for invulnerability

        if (this.touchMoveVector.length() > 0) {
            this.dodgeVector.copy(this.touchMoveVector);
        } else {
            let moveX = 0, moveY = 0;
            if (this.keys.left.isDown) moveX -= 1;
            if (this.keys.right.isDown) moveX += 1;
            if (this.keys.up.isDown) moveY -= 1;
            if (this.keys.down.isDown) moveY += 1;

            let inputVector = new Phaser.Math.Vector2(moveX, moveY);
            if (inputVector.length() > 0) {
                this.dodgeVector.copy(inputVector.normalize());
            } else {
                this.dodgeVector.copy(this.lastDirection);
            }
        }

        // End Dodge Roll & Remove i-Frames
        this.time.delayedCall(this.dodgeDuration, () => {
            this.isDodging = false;
            this.isInvulnerable = false; // --- i-Frames EXPIRED ---
            this.player.setAlpha(1.0);

            this.time.delayedCall(this.dodgeCooldown, () => { this.canDodge = true; });
        });
    }

    aimGunAt(targetX, targetY) {
        const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, targetX, targetY);
        this.gun.rotation = angle;
        this.gun.setFlipY(Math.abs(angle) > Math.PI / 2);
    }

    fireBullet() {
        this.canFire = false;
        const gunLength = 24;
        const angle = this.gun.rotation;
        const spawnX = this.gun.x + Math.cos(angle) * gunLength;
        const spawnY = this.gun.y + Math.sin(angle) * gunLength;

        let bullet = this.bullets.get(spawnX, spawnY);
        if (bullet) {
            bullet.setActive(true).setVisible(true).setPosition(spawnX, spawnY);
            bullet.rotation = angle;
            this.physics.velocityFromRotation(angle, this.bulletSpeed, bullet.body.velocity);

            this.time.delayedCall(3000, () => {
                if (bullet.active) {
                    bullet.setActive(false).setVisible(false);
                    bullet.body.stop();
                }
            });
        }

        this.reloadStartTime = this.time.now;
        this.time.delayedCall(this.fireCooldown, () => {
            this.canFire = true;
            this.reloadGraphics.clear();
        });
    }

    // --- Collision Handlers ---
    handleBulletEnemyCollision(bullet, enemy) {
        if (!bullet.active || !enemy.active) return;

        bullet.setActive(false).setVisible(false);
        bullet.body.stop();

        enemy.health -= 5; // Musket deals 5 damage per hit

        // Enemy Damage Flash
        enemy.setTint(0xffffff);
        this.time.delayedCall(80, () => { if (enemy.active) enemy.clearTint(); });

        if (enemy.health <= 0) {
            enemy.hpBar.destroy();
            enemy.destroy();
        }
    }

    handlePlayerShockwaveCollision(player, shockwave) {
        // Dodge i-Frames block shockwave damage entirely
        if (this.isInvulnerable) return;

        this.damagePlayer(1);
    }

    damagePlayer(amount) {
        if (this.isInvulnerable) return;

        this.playerHealth -= amount;
        this.isInvulnerable = true;

        // Flash Red on Hit
        this.player.setTint(0xff0000);
        this.time.delayedCall(200, () => { if (this.player.active) this.player.clearTint(); });

        // Grant post-hit invincibility frames
        this.tweens.add({
            targets: this.player,
            alpha: 0.3,
            duration: 100,
            yoyo: true,
            repeat: 4,
            onComplete: () => {
                this.player.setAlpha(1.0);
                this.isInvulnerable = false;
            }
        });

        if (this.playerHealth <= 0) {
            this.player.setTint(0x555555);
            this.physics.pause();
        }
    }

    updateReloadBar() {
        this.reloadGraphics.clear();
        if (!this.canFire && !this.isDodging) {
            let elapsed = this.time.now - this.reloadStartTime;
            let progress = Phaser.Math.Clamp(elapsed / this.fireCooldown, 0, 1);
            let barX = this.player.x;
            let barY = this.player.y - 28;

            this.reloadGraphics.lineStyle(3, 0x555555, 0.7);
            this.reloadGraphics.beginPath();
            this.reloadGraphics.arc(barX, barY, 8, 0, Phaser.Math.DEG_TO_RAD * 360, false);
            this.reloadGraphics.strokePath();

            this.reloadGraphics.lineStyle(3, 0xf39c12, 1);
            this.reloadGraphics.beginPath();
            this.reloadGraphics.arc(barX, barY, 8, Phaser.Math.DEG_TO_RAD * -90, Phaser.Math.DEG_TO_RAD * (-90 + (progress * 360)), false);
            this.reloadGraphics.strokePath();
        }
    }

    renderPlayerHealthUI() {
        this.uiGraphics.clear();
        
        // Draw 3 Heart Nodes (Top-Left Corner)
        for (let i = 0; i < this.playerMaxHealth; i++) {
            let x = 30 + (i * 30);
            let y = 30;

            if (i < this.playerHealth) {
                this.uiGraphics.fillStyle(0xe74c3c, 1); // Filled Red Heart Node
            } else {
                this.uiGraphics.fillStyle(0x7f8c8d, 0.5); // Empty Node
            }
            this.uiGraphics.fillCircle(x, y, 10);
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    backgroundColor: '#2c3e50',
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
