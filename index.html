<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Phaser 3 Top-Down 2-Player Co-Op</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
            color: white;
        }
        #game-container {
            position: relative;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        #multiplayer-ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }
        input, button {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { background-color: #7f8c8d; }
        input { width: 90px; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="multiplayer-ui">
        <button id="host-btn">Host Room</button>
        <span>OR</span>
        <input type="text" id="join-input" placeholder="CODE" maxlength="4">
        <button id="join-btn">Join</button>
        <span id="status-text" style="color: #f1c40f;">Offline</span>
    </div>
</div>

<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    preload() {
        let g = this.make.graphics({ x: 0, y: 0, add: false });
        
        // P1 Body (Blue)
        g.fillStyle(0x3498db, 1);
        g.fillCircle(16, 16, 16);
        g.generateTexture('player1', 32, 32);
        g.clear();

        // P2 Body (Green)
        g.fillStyle(0x2ecc71, 1);
        g.fillCircle(16, 16, 16);
        g.generateTexture('player2', 32, 32);
        g.clear();

        // Gun
        g.fillStyle(0x8b4513, 1);
        g.fillRect(0, 5, 14, 6);
        g.fillStyle(0x7f8c8d, 1);
        g.fillRect(10, 4, 14, 4);
        g.fillStyle(0xd4af37, 1);
        g.fillRect(6, 3, 4, 3);
        g.generateTexture('gun', 24, 16);
        g.clear();

        // Musket Ball
        g.fillStyle(0xbdc3c7, 1);
        g.fillCircle(4, 4, 4);
        g.generateTexture('bullet', 8, 8);
        g.clear();

        // Giant Enemy
        g.fillStyle(0xc0392b, 1);
        g.fillCircle(48, 48, 48);
        g.generateTexture('giant', 96, 96);
        g.clear();

        // Joystick Bases & Thumbs
        g.fillStyle(0xffffff, 0.2);
        g.fillCircle(40, 40, 40);
        g.generateTexture('joy-base', 80, 80);
        g.clear();

        g.fillStyle(0x3498db, 0.6);
        g.fillCircle(20, 20, 20);
        g.generateTexture('joy-thumb-move', 40, 40);
        g.clear();

        g.fillStyle(0xe67e22, 0.6);
        g.fillCircle(20, 20, 20);
        g.generateTexture('joy-thumb-aim', 40, 40);
        g.clear();

        // Dodge Button
        g.fillStyle(0xe74c3c, 0.7);
        g.fillCircle(28, 28, 28);
        g.generateTexture('dodge-btn', 56, 56);
        g.destroy();
    }

    create() {
        this.input.addPointer(3); // Support multi-touch for two sticks + dodge

        // Parameters
        this.speed = 125;
        this.dodgeSpeed = 350;
        this.dodgeDuration = 400;
        this.dodgeCooldown = 600;
        this.bulletSpeed = 500;
        this.fireCooldown = 1500;
        
        this.playerHealth = 3;
        this.isInvulnerable = false;
        this.canFire = true;
        this.isDodging = false;
        this.canDodge = true;
        
        this.lastDirection = new Phaser.Math.Vector2(0, 1);
        this.dodgeVector = new Phaser.Math.Vector2(0, 0);
        this.touchMoveVector = new Phaser.Math.Vector2(0, 0);
        this.touchAimVector = new Phaser.Math.Vector2(0, -1);
        this.isAimingWithStick = false;

        // Networking setup
        this.peer = null;
        this.conn = null;
        this.isHost = false;

        // Groups
        this.bullets = this.physics.add.group({ defaultKey: 'bullet', maxSize: 30 });
        this.enemies = this.physics.add.group();
        this.shockwaves = this.physics.add.group();

        // Local & Remote Players
        this.player = this.physics.add.sprite(350, 450, 'player1');
        this.player.setCollideWorldBounds(true);

        this.gun = this.add.sprite(this.player.x, this.player.y, 'gun').setOrigin(0, 0.5);

        this.remotePlayer = this.physics.add.sprite(450, 450, 'player2');
        this.remotePlayer.setCollideWorldBounds(true);
        this.remotePlayer.setVisible(false);

        this.remoteGun = this.add.sprite(this.remotePlayer.x, this.remotePlayer.y, 'gun').setOrigin(0, 0.5);
        this.remoteGun.setVisible(false);

        // UI Layers
        this.reloadGraphics = this.add.graphics().setDepth(10);
        this.uiGraphics = this.add.graphics().setDepth(100);

        // Keyboard Controls (Backup)
        this.keys = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D,
            dodge: Phaser.Input.Keyboard.KeyCodes.SPACE
        });

        this.setupVirtualControls();
        this.setupNetworking();

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.isDodging && this.canDodge) this.startDodge();
        });

        // Collisions
        this.physics.add.overlap(this.bullets, this.enemies, this.handleBulletEnemyCollision, null, this);
        this.physics.add.overlap(this.player, this.shockwaves, this.handlePlayerShockwaveCollision, null, this);

        this.spawnGiantEnemy(400, 150);
    }

    setupNetworking() {
        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        const joinInput = document.getElementById('join-input');
        const statusText = document.getElementById('status-text');

        hostBtn.addEventListener('click', () => {
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            this.peer = new Peer('MH-' + code);
            statusText.innerText = "Connecting...";

            this.peer.on('open', () => {
                this.isHost = true;
                statusText.innerText = "Code: " + code;
                hostBtn.disabled = true;
                joinBtn.disabled = true;
            });

            this.peer.on('connection', (c) => {
                this.conn = c;
                this.initConnection();
            });
        });

        joinBtn.addEventListener('click', () => {
            const code = joinInput.value.trim().toUpperCase();
            if (code.length !== 4) return;

            this.peer = new Peer();
            statusText.innerText = "Joining...";

            this.peer.on('open', () => {
                this.isHost = false;
                this.conn = this.peer.connect('MH-' + code);
                this.initConnection();
            });
        });
    }

    initConnection() {
        const statusText = document.getElementById('status-text');
        this.conn.on('open', () => {
            statusText.innerText = "CONNECTED!";
            statusText.style.color = "#2ecc71";
            
            if (!this.isHost) {
                this.player.setTexture('player2');
                this.remotePlayer.setTexture('player1');
            }

            this.remotePlayer.setVisible(true);
            this.remoteGun.setVisible(true);
        });

        this.conn.on('data', (data) => {
            this.handleNetworkData(data);
        });
    }

    sendNetData(data) {
        if (this.conn && this.conn.open) {
            this.conn.send(data);
        }
    }

    handleNetworkData(data) {
        if (data.type === 'state') {
            this.remotePlayer.setPosition(data.x, data.y);
            this.remoteGun.setPosition(data.x, data.y);
            this.remoteGun.rotation = data.gunRot;
            this.remoteGun.setFlipY(Math.abs(data.gunRot) > Math.PI / 2);
            this.remotePlayer.setAlpha(data.isDodging ? 0.5 : 1.0);
            this.remoteGun.setVisible(!data.isDodging);
        } else if (data.type === 'shoot') {
            this.fireBullet(data.x, data.y, data.angle, false);
        }
    }

    setupVirtualControls() {
        // 1. LEFT JOYSTICK (Movement) - Bottom Left
        this.moveBase = this.add.image(100, 500, 'joy-base').setScrollFactor(0).setDepth(100).setInteractive();
        this.moveThumb = this.add.image(100, 500, 'joy-thumb-move').setScrollFactor(0).setDepth(101);

        this.moveBase.on('pointerdown', (p) => this.handleMoveJoystick(p));
        this.moveBase.on('pointermove', (p) => { if (p.isDown) this.handleMoveJoystick(p); });
        this.moveBase.on('pointerup', () => this.resetMoveJoystick());

        // 2. RIGHT JOYSTICK (Aiming) - Bottom Right
        this.aimBase = this.add.image(700, 500, 'joy-base').setScrollFactor(0).setDepth(100).setInteractive();
        this.aimThumb = this.add.image(700, 500, 'joy-thumb-aim').setScrollFactor(0).setDepth(101);

        this.aimBase.on('pointerdown', (p) => this.handleAimJoystick(p));
        this.aimBase.on('pointermove', (p) => { if (p.isDown) this.handleAimJoystick(p); });
        this.aimBase.on('pointerup', () => this.resetAimJoystick());

        // 3. DODGE ROLL BUTTON - Placed Above Right Aim Joystick
        this.dodgeBtn = this.add.image(700, 390, 'dodge-btn').setScrollFactor(0).setDepth(100).setInteractive();
        this.add.text(678, 382, 'ROLL', { font: 'bold 12px sans-serif', fill: '#ffffff' }).setDepth(101);

        this.dodgeBtn.on('pointerdown', () => {
            if (!this.isDodging && this.canDodge) this.startDodge();
        });
    }

    handleMoveJoystick(pointer) {
        let angle = Phaser.Math.Angle.Between(this.moveBase.x, this.moveBase.y, pointer.x, pointer.y);
        let dist = Phaser.Math.Distance.Between(this.moveBase.x, this.moveBase.y, pointer.x, pointer.y);
        let clampDist = Math.min(dist, 40);

        this.moveThumb.x = this.moveBase.x + Math.cos(angle) * clampDist;
        this.moveThumb.y = this.moveBase.y + Math.sin(angle) * clampDist;

        this.touchMoveVector.set(Math.cos(angle), Math.sin(angle));
    }

    resetMoveJoystick() {
        this.moveThumb.x = this.moveBase.x;
        this.moveThumb.y = this.moveBase.y;
        this.touchMoveVector.set(0, 0);
    }

    handleAimJoystick(pointer) {
        let angle = Phaser.Math.Angle.Between(this.aimBase.x, this.aimBase.y, pointer.x, pointer.y);
        let dist = Phaser.Math.Distance.Between(this.aimBase.x, this.aimBase.y, pointer.x, pointer.y);
        let clampDist = Math.min(dist, 40);

        this.aimThumb.x = this.aimBase.x + Math.cos(angle) * clampDist;
        this.aimThumb.y = this.aimBase.y + Math.sin(angle) * clampDist;

        this.touchAimVector.set(Math.cos(angle), Math.sin(angle));
        this.isAimingWithStick = true;
    }

    resetAimJoystick() {
        this.aimThumb.x = this.aimBase.x;
        this.aimThumb.y = this.aimBase.y;
        this.isAimingWithStick = false;
    }

    spawnGiantEnemy(x, y) {
        let enemy = this.enemies.create(x, y, 'giant');
        enemy.setCollideWorldBounds(true);
        enemy.health = 40;
        enemy.maxHealth = 40;
        enemy.nextAttackTime = 0;
        enemy.isAttacking = false;
        enemy.hpBar = this.add.graphics();
    }

    update(time, delta) {
        if (this.playerHealth <= 0) return;

        // 1. Dodging State
        if (this.isDodging) {
            this.player.setVelocity(this.dodgeVector.x * this.dodgeSpeed, this.dodgeVector.y * this.dodgeSpeed);
            this.gun.setVisible(false);
            this.reloadGraphics.clear();
        } else {
            // Movement Logic
            let moveX = 0, moveY = 0;
            if (this.keys.left.isDown) moveX -= 1;
            if (this.keys.right.isDown) moveX += 1;
            if (this.keys.up.isDown) moveY -= 1;
            if (this.keys.down.isDown) moveY += 1;

            let moveVector = new Phaser.Math.Vector2(moveX, moveY);
            if (this.touchMoveVector.length() > 0) {
                moveVector.copy(this.touchMoveVector);
            } else if (moveVector.length() > 0) {
                moveVector.normalize();
            }

            if (moveVector.length() > 0) {
                this.lastDirection.copy(moveVector);
                this.player.setVelocity(moveVector.x * this.speed, moveVector.y * this.speed);
            } else {
                this.player.setVelocity(0, 0);
            }

            // Aiming & Gun Rotation
            this.gun.setVisible(true);
            this.gun.setPosition(this.player.x, this.player.y);

            let aimAngle = this.gun.rotation;
            if (this.isAimingWithStick) {
                aimAngle = this.touchAimVector.angle();
            } else if (this.input.activePointer.isDown && !this.sys.game.device.os.iOS) {
                aimAngle = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.input.activePointer.x, this.input.activePointer.y);
            }

            this.gun.rotation = aimAngle;
            this.gun.setFlipY(Math.abs(aimAngle) > Math.PI / 2);

            // AUTO-FIRE ON LINE OF SIGHT CHECK
            if (this.canFire) {
                this.checkLineOfSightAndFire();
            }
        }

        // Send network state update
        if (this.time.now % 50 < 20) {
            this.sendNetData({
                type: 'state',
                x: this.player.x,
                y: this.player.y,
                gunRot: this.gun.rotation,
                isDodging: this.isDodging
            });
        }

        // Enemy AI
        this.enemies.getChildren().forEach((enemy) => {
            if (!enemy.active) return;

            if (!enemy.isAttacking) {
                let target = this.player;
                if (this.remotePlayer.visible) {
                    let d1 = Phaser.Math.Distance.BetweenPoints(this.player, enemy);
                    let d2 = Phaser.Math.Distance.BetweenPoints(this.remotePlayer, enemy);
                    if (d2 < d1) target = this.remotePlayer;
                }
                this.physics.moveToObject(enemy, target, 40);
            } else {
                enemy.setVelocity(0, 0);
            }

            if (time > enemy.nextAttackTime) {
                this.performShockwaveAttack(enemy, time);
            }

            enemy.hpBar.clear();
            enemy.hpBar.fillStyle(0x000000, 0.5);
            enemy.hpBar.fillRect(enemy.x - 30, enemy.y - 65, 60, 8);
            enemy.hpBar.fillStyle(0x2ecc71, 1);
            enemy.hpBar.fillRect(enemy.x - 30, enemy.y - 65, (enemy.health / enemy.maxHealth) * 60, 8);
        });

        this.updateReloadBar();
        this.renderPlayerHealthUI();
    }

    // Line of Sight Auto-Firing System
    checkLineOfSightAndFire() {
        const gunAngle = this.gun.rotation;
        const rayLength = 600; // Raycast sight range

        let rayX = this.player.x + Math.cos(gunAngle) * rayLength;
        let rayY = this.player.y + Math.sin(gunAngle) * rayLength;

        let sightLine = new Phaser.Geom.Line(this.player.x, this.player.y, rayX, rayY);

        // Check if line of sight intersects with any monster body
        this.enemies.getChildren().forEach((enemy) => {
            if (!enemy.active) return;

            let enemyBounds = new Phaser.Geom.Circle(enemy.x, enemy.y, 48); // Giant collision radius
            if (Phaser.Geom.Intersects.LineToCircle(sightLine, enemyBounds)) {
                this.fireBullet(this.player.x, this.player.y, gunAngle, true);
            }
        });
    }

    performShockwaveAttack(enemy, time) {
        enemy.isAttacking = true;
        enemy.nextAttackTime = time + 3500;

        this.tweens.add({
            targets: enemy,
            tint: 0xf1c40f,
            duration: 500,
            yoyo: true,
            onComplete: () => {
                if (!enemy.active) return;
                enemy.clearTint();
                enemy.isAttacking = false;

                let shockwave = this.add.circle(enemy.x, enemy.y, 10);
                this.physics.add.existing(shockwave);
                shockwave.body.setCircle(10);
                this.shockwaves.add(shockwave);

                this.tweens.add({
                    targets: shockwave,
                    radius: 120,
                    alpha: 0,
                    duration: 800,
                    onUpdate: () => {
                        if (shockwave.body) {
                            shockwave.body.setCircle(shockwave.radius);
                            shockwave.body.offset.set(10 - shockwave.radius, 10 - shockwave.radius);
                        }
                    },
                    onComplete: () => { shockwave.destroy(); }
                });
            }
        });
    }

    startDodge() {
        this.isDodging = true;
        this.canDodge = false;
        this.isInvulnerable = true;
        this.player.setAlpha(0.5);

        if (this.touchMoveVector.length() > 0) {
            this.dodgeVector.copy(this.touchMoveVector);
        } else {
            let moveX = 0, moveY = 0;
            if (this.keys.left.isDown) moveX -= 1;
            if (this.keys.right.isDown) moveX += 1;
            if (this.keys.up.isDown) moveY -= 1;
            if (this.keys.down.isDown) moveY += 1;

            let inputVector = new Phaser.Math.Vector2(moveX, moveY);
            if (inputVector.length() > 0) {
                this.dodgeVector.copy(inputVector.normalize());
            } else {
                this.dodgeVector.copy(this.lastDirection);
            }
        }

        this.time.delayedCall(this.dodgeDuration, () => {
            this.isDodging = false;
            this.isInvulnerable = false;
            this.player.setAlpha(1.0);
            this.time.delayedCall(this.dodgeCooldown, () => { this.canDodge = true; });
        });
    }

    fireBullet(startX, startY, angle, isLocal = true) {
        if (isLocal) {
            this.canFire = false;
            this.sendNetData({ type: 'shoot', x: startX, y: startY, angle: angle });
        }

        const gunLength = 24;
        const spawnX = startX + Math.cos(angle) * gunLength;
        const spawnY = startY + Math.sin(angle) * gunLength;

        let bullet = this.bullets.get(spawnX, spawnY);
        if (bullet) {
            bullet.setActive(true).setVisible(true).setPosition(spawnX, spawnY);
            bullet.rotation = angle;
            this.physics.velocityFromRotation(angle, this.bulletSpeed, bullet.body.velocity);

            this.time.delayedCall(3000, () => {
                if (bullet.active) {
                    bullet.setActive(false).setVisible(false);
                    bullet.body.stop();
                }
            });
        }

        if (isLocal) {
            this.reloadStartTime = this.time.now;
            this.time.delayedCall(this.fireCooldown, () => {
                this.canFire = true;
                this.reloadGraphics.clear();
            });
        }
    }

    handleBulletEnemyCollision(bullet, enemy) {
        if (!bullet.active || !enemy.active) return;

        bullet.setActive(false).setVisible(false);
        bullet.body.stop();

        enemy.health -= 5;
        enemy.setTint(0xffffff);
        this.time.delayedCall(80, () => { if (enemy.active) enemy.clearTint(); });

        if (enemy.health <= 0) {
            enemy.hpBar.destroy();
            enemy.destroy();
        }
    }

    handlePlayerShockwaveCollision(player, shockwave) {
        if (this.isInvulnerable) return;
        this.damagePlayer(1);
    }

    damagePlayer(amount) {
        if (this.isInvulnerable) return;

        this.playerHealth -= amount;
        this.isInvulnerable = true;

        this.player.setTint(0xff0000);
        this.time.delayedCall(200, () => { if (this.player.active) this.player.clearTint(); });

        this.tweens.add({
            targets: this.player,
            alpha: 0.3,
            duration: 100,
            yoyo: true,
            repeat: 4,
            onComplete: () => {
                this.player.setAlpha(1.0);
                this.isInvulnerable = false;
            }
        });

        if (this.playerHealth <= 0) {
            this.player.setTint(0x555555);
            this.physics.pause();
        }
    }

    updateReloadBar() {
        this.reloadGraphics.clear();
        if (!this.canFire && !this.isDodging) {
            let elapsed = this.time.now - this.reloadStartTime;
            let progress = Phaser.Math.Clamp(elapsed / this.fireCooldown, 0, 1);
            let barX = this.player.x;
            let barY = this.player.y - 28;

            this.reloadGraphics.lineStyle(3, 0x555555, 0.7);
            this.reloadGraphics.beginPath();
            this.reloadGraphics.arc(barX, barY, 8, 0, Phaser.Math.DEG_TO_RAD * 360, false);
            this.reloadGraphics.strokePath();

            this.reloadGraphics.lineStyle(3, 0xf39c12, 1);
            this.reloadGraphics.beginPath();
            this.reloadGraphics.arc(barX, barY, 8, Phaser.Math.DEG_TO_RAD * -90, Phaser.Math.DEG_TO_RAD * (-90 + (progress * 360)), false);
            this.reloadGraphics.strokePath();
        }
    }

    renderPlayerHealthUI() {
        this.uiGraphics.clear();
        for (let i = 0; i < 3; i++) {
            let x = 30 + (i * 30);
            let y = 30;
            if (i < this.playerHealth) {
                this.uiGraphics.fillStyle(0xe74c3c, 1);
            } else {
                this.uiGraphics.fillStyle(0x7f8c8d, 0.5);
            }
            this.uiGraphics.fillCircle(x, y, 10);
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    backgroundColor: '#2c3e50',
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
